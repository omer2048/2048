<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code 2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- ÜST KISIM: Başlık, Skor ve Yeni Oyun Butonu -->
        <div class="header">
            <h1 class="title">2048</h1>
            <div class="header-right">
                <div class="score-container">SKOR: <span id="score">0</span></div>
                <button id="new-game-btn" class="new-game-btn">Yeni Oyun</button>
            </div>
        </div>

        <!-- OYUN ALANI -->
        <div class="grid-wrapper">
            <div class="grid-container" id="grid-container">
                <!-- Kareler JavaScript ile buraya eklenecek -->
            </div>
            <div id="game-over" class="game-over hidden">Oyun Bitti!</div>
        </div>

        <!-- ALT KISIM: Ekrandaki Ok Tuşları -->
        <div class="controls-container">
            <button class="arrow-btn up" id="btn-up">▲</button>
            <div class="middle-arrows">
                <button class="arrow-btn left" id="btn-left">◀</button>
                <button class="arrow-btn down" id="btn-down">▼</button>
                <button class="arrow-btn right" id="btn-right">▶</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
